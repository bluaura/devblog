<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 블루오라 개발노트</title>
<meta name="description" content="{{SUMMARY}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="https://bluaura.github.io/devblog/posts/{{SLUG}}.html">
<meta property="article:published_time" content="{{DATE}}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://bluaura.github.io/devblog/posts/{{SLUG}}.html">
<link rel="alternate" type="application/rss+xml" title="블루오라 개발노트" href="/devblog/rss.xml">
<link rel="stylesheet" href="/devblog/assets/style.css">
<script>
(function(){var t=localStorage.getItem('theme');
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>

<header class="site-header"><div class="wrap">
  <a class="brand" href="/devblog/"><span class="brand-mark">&lt;/&gt;</span>블루오라 개발노트</a>
  <nav class="nav">
    <a href="/devblog/">홈</a>
    <a href="/">투자노트</a>
    <a href="/devblog/rss.xml">RSS</a>
    <button class="theme-btn" id="themeBtn" aria-label="테마 전환">◐</button>
  </nav>
</div></header>

<main class="wrap article">
  <div class="article-head">
    <a class="back" href="/devblog/">← 목록으로</a>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{TAGHTML}} &nbsp;{{DATE}}</p>
  </div>

  <article class="article-body">
{{BODY}}
  </article>
</main>

<footer class="site-footer"><div class="wrap">
  <span>© 2026 bluaura</span>
  <span>코드와 설명은 개인 학습 기록이며, 실제 적용 전 공식 문서를 확인하세요.</span>
</div></footer>

<script src="/devblog/assets/hljs.min.js"></script>
<script>
// 테마 토글
var btn=document.getElementById('themeBtn');
btn&&btn.addEventListener('click',function(){
  var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',n);localStorage.setItem('theme',n);
});

// 문법 하이라이팅
if(window.hljs){hljs.highlightAll();}

// 코드 복사 버튼
document.querySelectorAll('.code').forEach(function(box){
  var pre=box.querySelector('pre'), btn=box.querySelector('.copy-btn');
  if(!pre||!btn)return;
  btn.addEventListener('click',function(){
    var t=pre.innerText;
    var done=function(){btn.textContent='복사됨';btn.classList.add('done');
      setTimeout(function(){btn.textContent='복사';btn.classList.remove('done');},1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done);
    }else{
      var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');document.body.removeChild(ta);done();
    }
  });
});

// h2 앵커 자동 부여 (목차 링크용)
document.querySelectorAll('.article-body h2').forEach(function(h,i){
  if(!h.id)h.id='s'+(i+1);
});
</script>
</body>
</html>
